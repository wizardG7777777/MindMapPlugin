<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="format" content="mindmap/1">
  <title>节点删除后的源文本示例</title>
</head>
<body>
  <header>
    <h1>删除中间节点之后</h1>
    <p>已删除 topic 及全部 4 条关联边；leaf 作为孤儿节点保留，不自动建立新的连接。</p>
  </header>
  <section class="map default">
    <article id="plan" class="basic rect">
      <h2 class="title">产品规划</h2>
      <div class="card">组织两个工作分支。</div>
      <div class="notes">删除中间节点不自动改变其他分支的归属。</div>
      <ul class="links">
        <li><a id="plan-other" href="#other">其他分支</a></li>
      </ul>
    </article>
    <article id="other" class="basic rect">
      <h2 class="title">其他分支</h2>
      <div class="card">引用主题和具体内容。</div>
      <div class="notes">删除主题后，指向具体内容的引用继续保留。</div>
      <ul class="links">
        <li><a id="other-leaf" href="#leaf">内容引用</a></li>
      </ul>
    </article>
    <article id="leaf" class="basic rect">
      <h2 class="title">具体内容</h2>
      <div class="card">相邻节点被删除、失去原有入边后仍保留。</div>
      <div class="notes">保留方案 A &amp; B 的说明，不自动挂到其他节点下面。</div>
      <ul class="links"></ul>
    </article>
    <article id="note" class="basic rect">
      <h2 class="title">独立说明</h2>
      <div class="card">这是原本就没有任何连线的节点。</div>
      <div class="notes">删除其他节点不会修改这里的内容。</div>
      <ul class="links"></ul>
    </article>
  </section>
</body>
</html>
